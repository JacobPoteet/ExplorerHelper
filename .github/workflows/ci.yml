name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      # build.ps1 publishes the app csproj by path, so this covers the app only.
      - name: Build & publish (smoke test the packaging path)
        run: ./build.ps1 -Version 0.0.0-ci

      # The shell extension is a separate project with no ProjectReference from the app, so the
      # publish above never touches it. Without this step a compile break there — most likely in
      # the hand-declared IExplorerCommand vtables — reaches main unnoticed and only surfaces the
      # next time someone runs packaging/Build-SparsePackage.ps1 (issue #37).
      - name: Build shell extension
        run: dotnet build src/ExplorerHelper.ShellExtension/ExplorerHelper.ShellExtension.csproj -c Release --nologo

      - uses: actions/upload-artifact@v7
        with:
          name: ExplorerHelper-ci
          path: artifacts/*.zip
